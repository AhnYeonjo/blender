<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blender 3D Gallery</title>
  <!-- Google model-viewer web component -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f1117;
      color: #e6edf3;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 16px 24px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .title-group h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #f0f6fc;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title-group p {
      font-size: 0.85rem;
      color: #8b949e;
      margin-top: 2px;
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn {
      background: #21262d;
      border: 1px solid #363b42;
      color: #c9d1d9;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: #30363d;
      border-color: #8b949e;
      color: #fff;
    }
    .btn.active {
      background: #238636;
      border-color: #2ea043;
      color: #fff;
    }
    .main-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    .sidebar {
      width: 260px;
      background: #161b22;
      border-right: 1px solid #30363d;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
    }
    .sidebar h2 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8b949e;
      margin-bottom: 8px;
    }
    .model-card {
      display: flex;
      flex-direction: column;
      padding: 12px;
      border-radius: 8px;
      background: #21262d;
      border: 1px solid #30363d;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }
    .model-card:hover {
      background: #2b323b;
      border-color: #58a6ff;
    }
    .model-card.active {
      background: #1f3a5f;
      border-color: #388bfd;
    }
    .model-card .name {
      font-weight: 600;
      font-size: 0.95rem;
      color: #f0f6fc;
    }
    .model-card .desc {
      font-size: 0.75rem;
      color: #8b949e;
      margin-top: 4px;
    }
    .viewer-area {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #1f242d 0%, #0d1117 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }
    .instruction-badge {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #30363d;
      font-size: 0.8rem;
      color: #8b949e;
      pointer-events: none;
      user-select: none;
      display: flex;
      gap: 12px;
    }
    .instruction-badge span {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column-reverse;
      }
      .sidebar {
        width: 100%;
        max-height: 160px;
        flex-direction: row;
        overflow-x: auto;
        border-right: none;
        border-top: 1px solid #30363d;
      }
      .model-card {
        min-width: 180px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>🎨 Blender 3D Gallery</h1>
      <p>Blender 3D 학습 및 실습 모델 인터랙티브 뷰어</p>
    </div>
    <div class="controls">
      <button id="toggle-autorotate" class="btn active">🔄 자동 회전</button>
      <button id="reset-cam" class="btn">🎯 시점 리셋</button>
    </div>
  </header>

  <div class="main-container">
    <div class="sidebar">
      <h2>3D Models</h2>
      
      <div class="model-card active" data-src="donuttutorial.glb" data-title="도넛 (Donut Tutorial)" data-desc="Blender Guru 튜토리얼 실습">
        <div class="name">🍩 Donut</div>
        <div class="desc">도넛 튜토리얼 실습</div>
      </div>

      <div class="model-card" data-src="house.glb" data-title="하우스 (House Modeling)" data-desc="건물/하우스 모델링 연습">
        <div class="name">🏠 House</div>
        <div class="desc">건물/하우스 모델링</div>
      </div>

      <div class="model-card" data-src="mushroom_vase.glb" data-title="버섯 화병 (Mushroom Vase)" data-desc="버섯 모양 오브젝트">
        <div class="name">🍄 Mushroom Vase</div>
        <div class="desc">버섯 화병 오브젝트</div>
      </div>

      <div class="model-card" data-src="pillow,blanket.glb" data-title="베개 & 담요 (Pillow & Blanket)" data-desc="Cloth 시뮬레이션 실습">
        <div class="name">🛏️ Pillow & Blanket</div>
        <div class="desc">패브릭 시뮬레이션</div>
      </div>

      <div class="model-card" data-src="untitled.glb" data-title="Untitled Study" data-desc="모델링 연습">
        <div class="name">📦 Untitled</div>
        <div class="desc">모델링 연습</div>
      </div>
    </div>

    <div class="viewer-area">
      <model-viewer
        id="viewer"
        src="donuttutorial.glb"
        alt="Blender 3D Model"
        auto-rotate
        rotation-per-second="30deg"
        camera-controls
        touch-action="pan-y"
        shadow-intensity="1.5"
        shadow-softness="0.8"
        exposure="1.0"
        environment-image="neutral"
      >
      </model-viewer>

      <div class="instruction-badge">
        <span>🖱️ 좌클릭 드래그: 360° 회전</span>
        <span>🔍 휠: 줌 인/아웃</span>
        <span>🖱️ 우클릭 드래그: 위치 이동</span>
      </div>
    </div>
  </div>

  <script>
    const viewer = document.getElementById('viewer');
    const cards = document.querySelectorAll('.model-card');
    const autoRotateBtn = document.getElementById('toggle-autorotate');
    const resetCamBtn = document.getElementById('reset-cam');

    cards.forEach(card => {
      card.addEventListener('click', () => {
        cards.forEach(c => c.classList.remove('active'));
        card.classList.add('active');
        const src = card.getAttribute('data-src');
        viewer.src = src;
      });
    });

    let autoRotate = true;
    autoRotateBtn.addEventListener('click', () => {
      autoRotate = !autoRotate;
      if (autoRotate) {
        viewer.setAttribute('auto-rotate', '');
        autoRotateBtn.classList.add('active');
      } else {
        viewer.removeAttribute('auto-rotate');
        autoRotateBtn.classList.remove('active');
      }
    });

    resetCamBtn.addEventListener('click', () => {
      viewer.cameraOrbit = '0deg 75deg 105%';
      viewer.cameraTarget = 'auto auto auto';
    });
  </script>
</body>
</html>
